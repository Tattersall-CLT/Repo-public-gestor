openapi: 3.0.3
info:
  title: Tattersall - Gestor Documental - API de Ingesta
  description: |
    # 📄 API de Ingesta de Documentos

    API REST para que proveedores externos (satélites) carguen documentos vehiculares al sistema Gestor Documental de Tattersall.

    ---

    ### 🔒 Autenticación (doble capa)

    Cada petición requiere **dos** credenciales simultáneas:

    1. **Token JWT** — en el header `Authorization: Bearer <token>`
    2. **API Key** — en el header `x-api-key`

    ---

    ### 🔑 Obtener Token JWT (paso previo)

    Antes de hacer cualquier request al API, el proveedor debe obtener un token de acceso:

    ```bash
    curl -X POST "<TOKEN_URL>" \
      -H "Content-Type: application/x-www-form-urlencoded" \
      -d "grant_type=client_credentials&scope=<SCOPE>" \
      -u "<CLIENT_ID>:<CLIENT_SECRET>"
    ```

    **Datos necesarios (provistos al dar de alta al proveedor):**

    | Dato | Descripción | Ejemplo |
    |------|-------------|---------|
    | `TOKEN_URL` | Endpoint Cognito para obtener tokens | `https://clt-bedrock-dev-auth-XXXXXX.auth.us-east-1.amazoncognito.com/oauth2/token` |
    | `CLIENT_ID` | Identificador del proveedor | (proporcionado al dar de alta) |
    | `CLIENT_SECRET` | Secreto del proveedor | (proporcionado al dar de alta) |
    | `SCOPE` | Permiso solicitado | (proporcionado al dar de alta) |

    **Respuesta:**
    ```json
    {
      "access_token": "eyJraWQ...",
      "expires_in": 3600,
      "token_type": "Bearer"
    }
    ```

    El token expira en **1 hora**. Renovar antes de que expire.

    ---

    ### 🚀 Ejemplo completo de carga

    ```bash
    curl -X PUT "<API_URL>/documents" \
      -H "Authorization: Bearer <TOKEN>" \
      -H "x-api-key: <API_KEY>" \
      -H "Content-Type: application/pdf" \
      -H "x-provider-id: <PROVIDER_ID>" \
      -H "x-patente: ABCD12" \
      -H "x-filename: permiso-circulacion-ABCD12.pdf" \
      -H "x-notification-email: operador@proveedor.cl" \
      --data-binary @archivo.pdf
    ```

    ---

    ### 📊 Headers requeridos en cada carga

    | Header | Obligatorio | Descripción |
    | :--- | :---: | :--- |
    | `Authorization` | **Sí** 🔑 | `Bearer <token_jwt>` obtenido de Cognito |
    | `x-api-key` | **Sí** 🔑 | API Key asignada al proveedor |
    | `Content-Type` | **Sí** 📁 | `application/pdf`, `application/msword`, o `application/vnd.openxmlformats-officedocument.wordprocessingml.document` |
    | `x-provider-id` | **Sí** 📡 | ID del proveedor asignado por administrador |
    | `x-patente` | ⚠️ Condicional 🚗 | Patente del vehículo (al menos uno de patente o vin) |
    | `x-vin` | ⚠️ Condicional 🚗 | VIN/chasis del vehículo (al menos uno de patente o vin) |
    | `x-filename` | **Sí** 📄 | Nombre original del archivo con extensión |
    | `x-notification-email` | No ✉️ | Email del responsable de la carga. Si el documento es rechazado, la notificación se envía a esta dirección |

    ---

    ### ✉️ Notificaciones de rechazo

    Cuando un documento es rechazado durante el procesamiento, el sistema emite una notificación
    indicando el archivo, el motivo del rechazo, el proveedor y la fecha.

    * **Sin `x-notification-email`:** la notificación llega únicamente a la lista de distribución
      del equipo de administración.
    * **Con `x-notification-email`:** la notificación se dirige además al responsable de la carga,
      permitiendo corregir y recargar el documento sin intermediarios.

    Motivos de rechazo más frecuentes: archivo vacío o corrupto, formato no soportado,
    tipo documental no reconocido, baja legibilidad y campos obligatorios ausentes.

    ---

    ### 📂 Formatos de archivo aceptados
    * 📑 `application/pdf` — Archivos PDF
    * 📝 `application/msword` — Word (.doc)
    * 📝 `application/vnd.openxmlformats-officedocument.wordprocessingml.document` — Word (.docx)

    ---

    ### 📁 Estructura en S3 (landing)

    Los archivos se depositan con la siguiente estructura:
    ```
    ingesta/source={provider_id}/{patente|vin|patente-vin}/{nombre}-{timestamp}-{id}.ext
    ```

    ---

    ### ⚙️ Límites
    * **Tamaño máximo:** 10 MB por archivo
    * **Rate Limit:** 20 requests/segundo por API Key
    * **Burst:** 50 requests concurrentes
    * **Quota:** 5,000 requests/día por API Key
    * **Token JWT:** expira en 1 hora
  version: 4.1.0
  contact:
    name: Equipo Escala 24x7

servers:
  - url: https://{apiId}.execute-api.us-east-1.amazonaws.com/Prod
    description: Ambiente Desarrollo
    variables:
      apiId:
        default: "REPLACE"

security:
  - BearerAuth: []
  - ApiKeyAuth: []

tags:
  - name: Ingesta
    description: Carga de documentos vehiculares.

paths:
  /documents:
    put:
      tags:
        - Ingesta
      summary: Carga directa de documento vehicular
      description: |
        Sube un archivo PDF o Word al sistema. Requiere token JWT + API Key.
        Al menos uno de `x-patente` o `x-vin` debe estar presente.

        Opcionalmente, el header `x-notification-email` permite recibir la
        notificación de rechazo directamente en el correo del responsable de la carga.
      operationId: uploadDocument
      parameters:
        - name: x-provider-id
          in: header
          required: true
          description: ID del proveedor asignado por administrador.
          schema:
            type: string
            example: "proveedor-ejemplo"
        - name: x-patente
          in: header
          required: false
          description: Patente del vehículo. Al menos uno de x-patente o x-vin es requerido.
          schema:
            type: string
            example: "ABCD12"
        - name: x-vin
          in: header
          required: false
          description: VIN (chasis) del vehículo. Al menos uno de x-patente o x-vin es requerido.
          schema:
            type: string
            example: "WDB1234567890"
        - name: x-filename
          in: header
          required: true
          description: Nombre original del archivo con extensión.
          schema:
            type: string
            example: "permiso-circulacion-ABCD12.pdf"
        - name: x-notification-email
          in: header
          required: false
          description: |
            Email del responsable de la carga. **Opcional pero recomendado.**

            Si el documento es rechazado durante el procesamiento (formato inválido,
            baja legibilidad, tipo documental no reconocido, campos obligatorios
            ausentes), la notificación se envía directamente a esta dirección.

            **Si se omite:** la notificación de rechazo se envía únicamente a la
            lista de distribución general del equipo de administración, sin
            identificar al responsable de la carga.
          schema:
            type: string
            format: email
            example: "operador@proveedor.cl"
      requestBody:
        required: true
        content:
          application/pdf:
            schema:
              type: string
              format: binary
          application/msword:
            schema:
              type: string
              format: binary
          application/vnd.openxmlformats-officedocument.wordprocessingml.document:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Documento subido exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSuccess'
              example:
                message: "Documento subido exitosamente"
                upload_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                s3_key: "ingesta/source=proveedor/patente=ABCD12/archivo-20260720-8d03.pdf"
                size_bytes: 245000
        '400':
          description: Error de validación (headers faltantes o formato incorrecto)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errors:
                  - "Header x-provider-id es requerido"
                  - "Al menos uno de los headers x-patente o x-vin es requerido"
                upload_id: "a1b2c3d4-e5f6-7890"
        '401':
          description: Token JWT inválido, expirado, o no proporcionado
          content:
            application/json:
              example:
                message: "Unauthorized"
        '403':
          description: API Key inválida o no proporcionada
          content:
            application/json:
              example:
                message: "Forbidden"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT obtenido via OAuth2 client_credentials desde Cognito.
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: API Key asignada a cada proveedor.

  schemas:
    UploadSuccess:
      type: object
      properties:
        message:
          type: string
        upload_id:
          type: string
          format: uuid
        s3_key:
          type: string
        size_bytes:
          type: integer

    ErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
        upload_id:
          type: string
          format: uuid
